<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かんたん勤怠</title>
<link rel="apple-touch-icon"href="icon.png">
<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;
  background:#ffffff;
  color:#1f2937;
}

.wrap{
  max-width:780px;
  margin:0 auto;
  padding:24px 18px 50px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:8px;
}

.tomato{
  font-size:58px;
  line-height:1;
}

h1{
  font-size:38px;
  margin:0;
  font-weight:800;
}

.sub{
  text-align:center;
  font-size:18px;
  margin:12px 0 26px;
}

label{
  font-size:18px;
  font-weight:700;
}

input,select,button{
  font:inherit;
}

input,select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:14px 16px;
  background:white;
}

.nameRow{
  display:grid;
  grid-template-columns:140px 1fr;
  align-items:center;
  gap:10px;
  margin-bottom:24px;
}

.dateLabel{
  font-size:20px;
  font-weight:700;
  margin-bottom:10px;
}

.today{
  background:#ecf9ef;
  border-radius:14px;
  padding:16px;
  text-align:center;
  font-size:34px;
  font-weight:800;
  color:#14532d;
}

.clock{
  margin-top:14px;
  background:#eaf5ff;
  border-radius:14px;
  padding:14px;
  text-align:center;
  font-size:42px;
  font-weight:800;
  color:#1670c5;
}

.status{
  text-align:center;
  margin:10px 0 18px;
  font-size:20px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

button{
  border:0;
  border-radius:14px;
  padding:16px;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}

.in{
  background:#2eaa50;
  color:white;
}

.out{
  background:#eeeeee;
  color:#202733;
}

.line{
  width:100%;
  margin-top:14px;
  background:#e9f6ff;
  color:#0878d8;
}

.tabs{
  display:flex;
  gap:12px;
  margin-top:28px;
  margin-bottom:20px;
}

.tab{
  padding:12px 24px;
  background:#eeeeee;
}

.tab.active{
  background:#2f92ed;
  color:white;
}

.monthRow{
  display:grid;
  grid-template-columns:100px 1fr;
  align-items:center;
  gap:10px;
}

.csv{
  width:100%;
  margin-top:18px;
  background:#eeeeee;
  color:#202733;
}

.summaryBox{
  margin-top:14px;
  padding:20px;
  border-radius:15px;
  background:#fff8e8;
}

.summaryTitle{
  font-size:18px;
}

.summaryHours{
  font-size:38px;
  font-weight:800;
  color:#6d3c00;
}

.summaryMinutes{
  font-size:18px;
  margin-left:12px;
}

.scroll{
  overflow:auto;
  margin-top:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}

th,td{
  border-bottom:1px solid #e5e7eb;
  padding:10px 6px;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#f8fafc;
}

.hidden{
  display:none;
}

.note{
  margin-top:20px;
  font-size:13px;
  color:#6b7280;
  line-height:1.5;
}

@media(max-width:600px){
  .wrap{
    padding:20px 14px 40px;
  }

  h1{
    font-size:32px;
  }

  .tomato{
    font-size:48px;
  }

  .sub{
    font-size:16px;
  }

  .nameRow{
    grid-template-columns:120px 1fr;
  }

  .today{
    font-size:29px;
  }

  .clock{
    font-size:38px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <div class="tomato">🍅</div>
    <h1>かんたん勤怠</h1>
  </div>

  <div class="sub">
    出勤・退勤を記録し、月間・年間で確認できます。
  </div>

  <div class="nameRow">
    <label for="employee">従業員名</label>
    <input id="employee" placeholder="例：山田 太郎">
  </div>

  <div class="dateLabel">本日の日付</div>

  <div id="todayDisplay" class="today">
    ----/--/--（-）
  </div>

  <input id="date" type="hidden">

  <div id="clock" class="clock">
    --:--:--
  </div>

  <div id="status" class="status">
    未出勤
  </div>

  <div class="actions">
    <button class="in" onclick="clockIn()">出勤</button>
    <button class="out" onclick="clockOut()">退勤</button>
  </div>


  
  <button
    id="lineBtn"
    class="line"
    style="display:none"
    onclick="sendLineWork()">
    今日の労働時間をLINEで送る
  </button>

  <div class="tabs">
    <button
      id="tabMonth"
      class="tab active"
      onclick="showTab('month')">
      月間
    </button>

    <button
      id="tabYear"
      class="tab"
      onclick="showTab('year')">
      年間
    </button>
  </div>

  <div id="monthPane">

    <div class="monthRow">
      <label for="month">対象月</label>
      <input
        id="month"
        type="month"
        onchange="renderMonth()">
    </div>

    <button class="csv" onclick="exportCSV()">
      CSV出力
    </button>

    <div class="summaryBox">
      <div class="summaryTitle">本月の労働時間</div>

      <span id="workHours" class="summaryHours">
        0.00 時間
      </span>

      <span id="workMinutes" class="summaryMinutes">
        （0分）
      </span>
    </div>

    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>日付</th>
            <th>出勤</th>
            <th>退勤</th>
            <th>労働時間</th>
          </tr>
        </thead>

        <tbody id="monthBody"></tbody>
      </table>
    </div>

  </div>

  <div id="yearPane" class="hidden">

    <label for="year">対象年</label>
    <select id="year" onchange="renderYear()"></select>

    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>月</th>
            <th>労働時間</th>
          </tr>
        </thead>

        <tbody id="yearBody"></tbody>
      </table>
    </div>

  </div>

  <div class="note">
    12:00〜13:00は休憩時間として、自動的に労働時間から差し引きます。
  </div>

</div>

<script>

const LS_KEY = "simple_attendance_v1";

function nowTime(){
  const d = new Date();
  return d.toTimeString().slice(0,8);
}

function todayStr(){
  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

function todayDisplayStr(){
  const d = new Date();

  const week = ["日","月","火","水","木","金","土"];

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}/${m}/${day}（${week[d.getDay()]}）`;
}

function getData(){

  try{
    return JSON.parse(
      localStorage.getItem(LS_KEY) || "{}"
    );
  }
  catch{
    return {};
  }

}

function saveData(data){
  localStorage.setItem(
    LS_KEY,
    JSON.stringify(data)
  );
}

function employee(){

  return (
    document.getElementById("employee")
      .value
      .trim()
    || "未設定"
  );

}

function recordKey(){

  return (
    employee()
    + "|"
    + document.getElementById("date").value
  );

}

function getRecord(){

  const data = getData();

  return data[recordKey()] || {
    employee: employee(),
    date: document.getElementById("date").value,
    in:"",
    out:"",
    breaks:[]
  };

}

function saveRecord(record){

  const data = getData();

  data[recordKey()] = record;

  saveData(data);

  renderStatus();
  renderMonth();
  renderYear();

}

function clockIn(){

  const r = getRecord();

  if(!r.in){
    r.in = nowTime();
  }

  saveRecord(r);

}

function clockOut(){

  const r = getRecord();

  if(!r.in){
    alert("先に出勤を押してください。");
    return;
  }

  r.out = nowTime();

  saveRecord(r);
sendLineWork();
}

function seconds(time){

  if(!time){
    return 0;
  }

  const p = time.split(":").map(Number);

  return (
    p[0]*3600
    + p[1]*60
    + p[2]
  );

}

function workSeconds(record){

  if(!record.in || !record.out){
    return 0;
  }

  let start = seconds(record.in);
  let end = seconds(record.out);

  if(end < start){
    end += 86400;
  }

  let total = end - start;

  const lunchStart = 12 * 3600;
  const lunchEnd = 13 * 3600;

  const overlapStart =
    Math.max(start,lunchStart);

  const overlapEnd =
    Math.min(end,lunchEnd);

  if(overlapEnd > overlapStart){
    total -= overlapEnd - overlapStart;
  }

  return Math.floor(Math.max(0,total) / 1800) * 1800;

}

function renderStatus(){

  const r = getRecord();

  const status =
    document.getElementById("status");

  if(r.out){
    status.textContent =
      "退勤済み " + r.out;
  }
  else if(r.in){
    status.textContent =
      "勤務中（出勤 " + r.in + "）";
  }
  else{
    status.textContent =
      "未出勤";
  }

  document.getElementById("lineBtn")
    .style.display =
    r.in && r.out
    ? "block"
    : "none";

}

function employeeRecords(){

  return Object
    .values(getData())
    .filter(
      r => r.employee === employee()
    );

}

function formatHours(sec){

  return (sec / 3600).toFixed(2);

}

function formatHM(sec){

  const totalMinutes =
    Math.round(sec / 60);

  const h =
    Math.floor(totalMinutes / 60);

  const m =
    totalMinutes % 60;

  return `${h}時間${m}分`;

}

function renderMonth(){

  const month =
    document.getElementById("month").value;

  const rows =
    employeeRecords()
    .filter(
      r => r.date.startsWith(month)
    )
    .sort(
      (a,b) =>
      a.date.localeCompare(b.date)
    );

  let total = 0;

  const body =
    document.getElementById("monthBody");

  body.innerHTML = "";

  rows.forEach(r=>{

    const sec = workSeconds(r);

    total += sec;

    const tr =
      document.createElement("tr");

    tr.innerHTML =
      `<td>${r.date}</td>
       <td>${r.in || "-"}</td>
       <td>${r.out || "-"}</td>
       <td>${formatHours(sec)}h</td>`;

    body.appendChild(tr);

  });

  document.getElementById("workHours")
    .textContent =
    formatHours(total) + " 時間";

  document.getElementById("workMinutes")
    .textContent =
    "（" +
    Math.round(total / 60)
    + "分）";

}

function setupYears(){

  const current =
    new Date().getFullYear();

  const select =
    document.getElementById("year");

  select.innerHTML = "";

  for(
    let y=current-2;
    y<=current+2;
    y++
  ){

    const option =
      document.createElement("option");

    option.value = y;
    option.textContent =
      y + "年";

    if(y === current){
      option.selected = true;
    }

    select.appendChild(option);

  }

}

function renderYear(){

  const year =
    document.getElementById("year").value;

  const body =
    document.getElementById("yearBody");

  body.innerHTML = "";

  for(let m=1;m<=12;m++){

    const mm =
      String(m).padStart(2,"0");

    const rows =
      employeeRecords()
      .filter(
        r =>
        r.date.startsWith(
          `${year}-${mm}`
        )
      );

    let total = 0;

    rows.forEach(r=>{
      total += workSeconds(r);
    });

    const tr =
      document.createElement("tr");

    tr.innerHTML =
      `<td>${m}月</td>
       <td>${formatHours(total)}h</td>`;

    body.appendChild(tr);

  }

}

function showTab(tab){

  const monthPane =
    document.getElementById("monthPane");

  const yearPane =
    document.getElementById("yearPane");

  monthPane.classList.toggle(
    "hidden",
    tab !== "month"
  );

  yearPane.classList.toggle(
    "hidden",
    tab !== "year"
  );

  document
    .getElementById("tabMonth")
    .classList.toggle(
      "active",
      tab === "month"
    );

  document
    .getElementById("tabYear")
    .classList.toggle(
      "active",
      tab === "year"
    );

  if(tab === "year"){
    renderYear();
  }

}

function sendLineWork(){

  const r = getRecord();

  if(!r.in || !r.out){
    alert("先に退勤を押してください。");
    return;
  }

  const work =
    formatHM(workSeconds(r));

  const text =
    `${r.employee}｜`
    + `${r.date.replaceAll("-","/")}｜`
    + `労働時間 ${work}`;

  fetch("https://script.google.com/macros/s/AKfycbzLctfkdXjtycy8-lljzpAehgwiMYPbk2TjpgBSsO-y-awwsMctV_t3gyK-a9-Y0Ixc/exec",{
    method: "post",
    body: new URLSearchParams({ text:text })
  })

}

function exportCSV(){

  const month =
    document.getElementById("month").value;

  const rows =
    employeeRecords()
    .filter(
      r => r.date.startsWith(month)
    )
    .sort(
      (a,b) =>
      a.date.localeCompare(b.date)
    );

  let csv =
    "\uFEFF氏名,日付,出勤,退勤,労働時間\n";

  rows.forEach(r=>{

    csv +=
      `${r.employee},`
      + `${r.date},`
      + `${r.in || ""},`
      + `${r.out || ""},`
      + `${formatHours(workSeconds(r))}\n`;

  });

  const blob =
    new Blob(
      [csv],
      {type:"text/csv;charset=utf-8"}
    );

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    `勤怠_${employee()}_${month}.csv`;

  a.click();

  URL.revokeObjectURL(a.href);

}

document
  .getElementById("employee")
  .addEventListener(
    "change",
    ()=>{
      localStorage.setItem(
        "attendance_employee",
        employee()
      );

      renderStatus();
      renderMonth();
      renderYear();
    }
  );

document.getElementById("date").value =
  todayStr();

document.getElementById("todayDisplay")
  .textContent =
  todayDisplayStr();

document.getElementById("month").value =
  todayStr().slice(0,7);

document.getElementById("employee").value =
  localStorage.getItem(
    "attendance_employee"
  ) || "";

setupYears();

renderStatus();
renderMonth();
renderYear();

setInterval(
  ()=>{
    document.getElementById("clock")
      .textContent =
      nowTime();
  },
  500
);

</script>

</body>
</html>
